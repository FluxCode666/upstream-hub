name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的 vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      release_title: ${{ steps.release.outputs.release_title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}

      - name: Validate release tag and changelog
        id: release
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::发布 tag 必须是 vX.Y.Z 格式"
            exit 1
          fi

          # checkout 会把事件提交重新写入同名 tag ref，按远端 tag ref 恢复附注对象。
          git fetch --force --no-tags origin "refs/tags/$VERSION:refs/tags/$VERSION"

          source_commit="$(git rev-parse HEAD)"
          if [[ "$(git cat-file -t "refs/tags/$VERSION")" != "tag" ]]; then
            echo "::error::请创建带中文说明的附注 tag，不能使用轻量 tag"
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "refs/tags/$VERSION")"
          if [[ "$tag_commit" != "$source_commit" ]]; then
            echo "::error::发布 tag 与检出的提交不一致"
            exit 1
          fi

          tag_subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$VERSION")"
          if ! printf '%s' "$tag_subject" | python3 -c 'import sys; sys.exit(not any("\u3400" <= c <= "\u9fff" for c in sys.stdin.read()))'; then
            echo "::error::附注 tag 的标题必须包含中文发布说明"
            exit 1
          fi

          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/release_notes.py "$VERSION" CHANGELOG.md > /dev/null

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "release_title=$VERSION - $tag_subject" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check backend
        working-directory: backend
        run: |
          go vet ./...
          go test ./...

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Check frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level critical
          pnpm lint
          pnpm typecheck
          pnpm build

  build-and-push:
    name: Build and Push Image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ needs.verify.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_commit }}

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/upstream-hub" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=upstream-hub-production
          cache-to: type=gha,mode=max,scope=upstream-hub-production
          provenance: false

  release:
    name: Publish GitHub Release
    needs: [verify, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_commit }}

      - name: Prepare Chinese release notes
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_notes.py "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          {
            echo
            echo "镜像：\`$IMAGE@$DIGEST\`"
            echo "提交：\`$SOURCE_COMMIT\`"
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.verify.outputs.release_title }}
          body_path: ${{ runner.temp }}/release-notes.md

  deploy:
    name: Deploy Production
    needs: [verify, build-and-push, release]
    runs-on: ubuntu-latest
    concurrency:
      group: upstream-hub-production-deploy
      cancel-in-progress: false
    environment: production
    env:
      GHCR_IMAGE: ${{ needs.build-and-push.outputs.image }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.version }}
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
      GHCR_USER: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/upstream-hub' }}
      DEPLOY_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Deploy with SSH username and password
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOSTS }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: GHCR_IMAGE,IMAGE_TAG,IMAGE_DIGEST,GHCR_USER,GHCR_PAT,DEPLOY_PATH,DEPLOY_RUN_ID
          sync: true
          command_timeout: 20m
          script: |
            set -eu
            umask 077
            cd "$DEPLOY_PATH"

            docker compose version >/dev/null
            [ -f docker-compose.yml ] || { echo "缺少 $DEPLOY_PATH/docker-compose.yml" >&2; exit 1; }
            [ -f .env ] || { echo "缺少 $DEPLOY_PATH/.env" >&2; exit 1; }

            current_tag="$(sed -n 's/^UPSTREAMHUB_IMAGE_TAG=//p' .env | tail -n 1)"
            if printf '%s' "$current_tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' &&
               [ "$current_tag" != "$IMAGE_TAG" ] &&
               [ "$(printf '%s\n%s\n' "$IMAGE_TAG" "$current_tag" | sort -V | head -n 1)" = "$IMAGE_TAG" ]; then
              echo "当前生产版本 $current_tag 高于 $IMAGE_TAG，跳过旧版本部署"
              exit 0
            fi

            registry_config="$(mktemp -d)"
            rollback_enabled=false
            rollback_image=""

            finish() {
              status="$?"
              trap - 0
              rm -rf -- "$registry_config"

              if [ "$rollback_enabled" = "true" ]; then
                echo "部署失败，正在恢复部署前容器镜像" >&2
                cp .env.cicd.previous .env

                if [ -n "$rollback_image" ]; then
                  set_env_value UPSTREAMHUB_IMAGE "upstream-hub-local-rollback"
                  set_env_value UPSTREAMHUB_IMAGE_TAG "run-$DEPLOY_RUN_ID"
                  docker compose up -d --no-build --pull never app || true
                else
                  echo "部署前没有运行中的 app 容器，仅恢复 .env 配置" >&2
                fi
              fi

              exit "$status"
            }
            trap finish 0

            if [ -n "${GHCR_PAT:-}" ]; then
              if ! printf '%s' "$GHCR_PAT" | docker --config "$registry_config" login ghcr.io --username "$GHCR_USER" --password-stdin; then
                echo "GHCR 登录失败，将尝试匿名拉取；公开镜像请删除 GHCR_PAT，私有镜像请检查 classic PAT 的 read:packages 权限" >&2
                rm -rf -- "$registry_config"
                registry_config="$(mktemp -d)"
              fi
            fi

            if ! docker --config "$registry_config" pull "$GHCR_IMAGE@$IMAGE_DIGEST"; then
              echo "无法拉取 $GHCR_IMAGE@$IMAGE_DIGEST；当前服务尚未修改" >&2
              exit 1
            fi
            docker tag "$GHCR_IMAGE@$IMAGE_DIGEST" "$GHCR_IMAGE:$IMAGE_TAG"

            set_env_value() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                escaped_value="$(printf '%s' "$value" | sed 's/[&|\\]/\\&/g')"
                sed -i "s|^${key}=.*$|${key}=${escaped_value}|" .env
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
            }

            previous_container_id="$(docker compose ps -q app 2>/dev/null || true)"
            if [ -n "$previous_container_id" ]; then
              previous_image_id="$(docker inspect --format '{{.Image}}' "$previous_container_id")"
              rollback_image="upstream-hub-local-rollback:run-$DEPLOY_RUN_ID"
              docker tag "$previous_image_id" "$rollback_image"
            fi

            cp .env .env.cicd.previous
            rollback_enabled=true

            set_env_value UPSTREAMHUB_IMAGE "$GHCR_IMAGE"
            set_env_value UPSTREAMHUB_IMAGE_TAG "$IMAGE_TAG"

            docker compose config --quiet
            docker compose config --services | grep -qx app
            docker compose up -d --no-build --pull never app

            container_id="$(docker compose ps -q app)"
            [ -n "$container_id" ]

            attempt=1
            while [ "$attempt" -le 36 ]; do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)"
              echo "健康检查 $attempt/36：$health"

              if [ "$health" = "healthy" ] || [ "$health" = "running" ]; then
                break
              fi

              if [ "$health" = "unhealthy" ] || [ "$health" = "exited" ] || [ "$attempt" -eq 36 ]; then
                docker compose logs --tail=100 app || true
                exit 1
              fi

              attempt=$((attempt + 1))
              sleep 5
            done

            docker compose ps app
            rollback_enabled=false
            if [ -n "$rollback_image" ]; then
              docker image rm "$rollback_image" >/dev/null 2>&1 || true
            fi
            trap - 0
            rm -rf -- "$registry_config"
            echo "生产环境部署完成：$GHCR_IMAGE@$IMAGE_DIGEST"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## 生产部署任务"
            echo "- 目标 Tag：\`${{ needs.verify.outputs.version }}\`"
            echo "- 镜像：\`${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}\`"
            echo "- 提交：\`${{ needs.verify.outputs.source_commit }}\`"
            echo "- 操作者：${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
