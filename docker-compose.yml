services:
  app:
    # 生产流水线会把 GHCR 仓库和发布 tag 对应的版本标签写入服务器 .env。
    # 本地默认仍使用 Docker Hub 的 latest；也可手动覆盖仓库与标签。
    # 如果指定的 image 在 Docker Hub 找不到，且本机没缓存，会回落到 build 块从源码构建。
    # 完全离线 / 强制重建：`docker compose build`；强制重新拉：`docker compose pull`。
    image: ${UPSTREAMHUB_IMAGE:-worryzyy/upstream-hub}:${UPSTREAMHUB_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upstream-hub
    restart: unless-stopped
    environment:
      UPSTREAMHUB_SERVER_PORT: 8418
      UPSTREAMHUB_SERVER_MODE: ${UPSTREAMHUB_SERVER_MODE:-release}
      UPSTREAMHUB_LOG_LEVEL: ${UPSTREAMHUB_LOG_LEVEL:-info}
      # 默认 SQLite：数据库就是下方挂载卷里的 /app/data/upstream-hub.db，零外部依赖。
      # 要继续用外部 PostgreSQL 时在 .env 里设 UPSTREAMHUB_DATABASE_DRIVER=postgres
      # 并填好 POSTGRES_* 各项（compose 会透传给 backend）。
      UPSTREAMHUB_DATABASE_DRIVER: ${UPSTREAMHUB_DATABASE_DRIVER:-sqlite}
      UPSTREAMHUB_DATABASE_PATH: /app/data/upstream-hub.db
      UPSTREAMHUB_DATABASE_HOST: ${POSTGRES_HOST:-172.17.0.1}
      UPSTREAMHUB_DATABASE_PORT: ${POSTGRES_PORT:-5432}
      UPSTREAMHUB_DATABASE_USER: ${POSTGRES_USER:-upstream_hub}
      UPSTREAMHUB_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      UPSTREAMHUB_DATABASE_NAME: ${POSTGRES_DB:-upstream_hub}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required, set it in .env}
      # 鉴权默认关闭。设 AUTH_ENABLED=true 时 ADMIN_PASSWORD 也必须填，否则后端启动失败。
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      # 飞书交互卡片回调验签密钥：必须与飞书开放平台「事件与回调」里的 Encrypt Key 一致。
      # 留空则回调路由不注册，飞书验证回调 URL 会因返回 HTML 而报「不是合法的JSON格式」。
      UPSTREAMHUB_NOTIFICATIONS_FEISHUENCRYPTKEY: ${UPSTREAMHUB_NOTIFICATIONS_FEISHUENCRYPTKEY:-}
    ports:
      - "${UPSTREAMHUB_HTTP_PORT:-8080}:8418"
    volumes:
      # SQLite 数据文件持久化。换容器 / 升级镜像时数据不丢。
      - upstream-hub-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8418/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  upstream-hub-data:
